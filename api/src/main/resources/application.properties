spring.application.name=storefront-bff

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storefront}
spring.datasource.username=${DB_USER:storefront}
spring.datasource.password=${DB_PASSWORD:storefront}

# Flyway owns the schema. JPA only validates that its mapping matches what
# Flyway produced, so a mapping drift fails at boot instead of at 3am.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

storefront.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
