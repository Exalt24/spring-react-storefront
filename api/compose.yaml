services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - storefront-db:/var/lib/postgresql/data

volumes:
  storefront-db:
